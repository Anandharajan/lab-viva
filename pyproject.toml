[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lab-viva"
version = "0.1.1"
description = "Concept-graph-grounded adaptive viva with 2PL IRT calibration and CAT selection."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Anandharajan TRV", email = "trvanandharajan@gmail.com" }]
dependencies = [
  "pydantic>=2",
  "numpy",
  "scikit-learn"
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
nli = ["sentence-transformers>=3"]
dev = ["pytest>=8", "hypothesis>=6", "pytest-cov", "ruff", "mypy"]

[project.scripts]
lab-viva = "lab_viva.cli:main"
lab-viva-mcp = "lab_viva.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lab_viva"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP", "B"]
ignore = ["B905", "B007", "E702"]
